<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PATMOL | Libro de Reclamaciones</title>
    <link rel="stylesheet" href="output.css">
</head>

<body class="m-0">
    <nav class="flex flex-row items-center m-10">
        <a href="index.html"><img class="w-48" src="assets/patmol_icon.png"></a>
        <div class="flex md:flex-row justify-end gap-8 flex-1">
            <a>Investigaciones</a>
            <a href="publicaciones.html">Publicaciones</a>
            <a href="reclamos.html">Libro de Reclamaciones</a>
            <a>Contacto</a>
        </div>
    </nav>
    <article>
        <span class="bg-lima w-full m-10 text-5xl">Reclamos</span>
        <div>
            <form class="flex flex-col w-2/5 m-10 gap-5">
                <div class="flex flex-row gap-3 md:gap-5">
                    <div class="flex flex-col">
                        <label>Nombre</label>
                        <input type="text" id="nombres" name="nombre" class="border">
                    </div>
                    <div class="flex flex-col">
                        <label>Apellido</label>
                        <input type="text" id="apellido" name="apellido" class="border">
                    </div>
                </div>
                <div class="flex flex-col">
                    <label>Correo electrónico </label>
                    <input type="email" id="correo" name="correo" required class="border">
                </div>
                <div class="flex flex-col">
                    <label for="reclamo">Reclamo </label>
                    <input type="text" id="reclamo" name="reclamo" class="h-64 border">
                </div>

                <input type="submit" value="Enviar" class="bg-marine text-white">
            </form>
        </div>
    </article>
    <footer>
        <div class="flex flex-col items-center">
            <img class="w-80" src="assets/patmol_icon.png">
            <nav class="flex flex-row items-center gap-5">
                <a>Facebook</a>
                <a>Twitter</a>
                <a>LinkedIn</a>
            </nav>
        </div>
        <span class="w-full flex justify-center bg-marine text-white">Copyright © 2026 PATMOL</span>
    </footer>
</body>

</html>
